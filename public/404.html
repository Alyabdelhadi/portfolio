<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Page not found — Ali Abdelhadi</title>
<link rel="icon" href="/favicon.png" type="image/png" />
<style>
  :root { --bg: #F5F5F3; --ink: #111; --muted: #6A6A6A; --blue: #045AC9; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 1.05rem/1.5 system-ui, -apple-system, sans-serif; }
  main { padding: 24px 16px; max-width: 34rem; }
  p.code { font-family: ui-monospace, "Cascadia Mono", monospace; color: var(--muted); margin: 0 0 12px; }
  h1 { font-size: clamp(2rem, 7vw, 3.4rem); line-height: 1.05; letter-spacing: -.03em; margin: 0 0 16px; }
  h1 span { color: var(--blue); }
  a { display: inline-block; margin-top: 12px; padding: 12px 20px; border-radius: 999px; background: var(--blue); color: #fff; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>This page doesn't exist.<br /><span>The work does.</span></h1>
  <p>The link may be old or mistyped. Everything lives on the home page: projects, process and how to get in touch.</p>
  <a href="/">Back to the portfolio</a>
</main>
</body>
</html>
